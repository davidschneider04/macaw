<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 12 170 230" width="170" height="230" role="img" aria-labelledby="title">
  <title id="title">macaw</title>

  <!-- Tail: two long feathers, red with blue tips -->
  <polygon points="120,138 138,146 170,222 176,238 160,228" fill="#B01C24"/>
  <polygon points="147.6,200 160,198.4 170,222 176,238 160,228" fill="#1F6FD1"/>
  <polygon points="128,140 146,142 186,212 190,232 178,218" fill="#B01C24"/>
  <polygon points="163,194.6 174,191 186,212 190,232 178,218" fill="#1F6FD1"/>

  <!-- Perch -->
  <polygon points="30,140 176,126 178,134 32,150" fill="#6B4A2F"/>

  <!-- Head and body -->
  <polygon points="66,40 80,22 102,20 116,32 120,56 126,82 122,116 104,132 88,128 80,104 72,84 76,64" fill="#E3262E"/>

  <!-- Wing: red coverts, yellow band, blue flight feathers -->
