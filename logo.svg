  <!-- Eye -->
  <circle cx="84" cy="41" r="4.5" fill="#FFC20E"/>
  <circle cx="84" cy="41" r="2.2" fill="#111111"/>

  <!-- Beak: pale hooked upper mandible, dark lower -->
